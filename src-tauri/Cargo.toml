[package]
name = "digitify"
version = "0.1.0"
description = "Digitify: your physical collection, digitally preserved and beautifully organized"
authors = ["Digitify contributors"]
edition = "2021"
publish = false

[lib]
name = "digitify_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time"] }
walkdir = "2"
lofty = "0.25"
zip = "9"
roxmltree = "0.21"
blake3 = "1"
rayon = "1"
trash = "5"
imagesize = "0.15"
# Comic archives besides ZIP (D-017): RAR via RARLAB's UnRAR source, 7z read-only, TAR.
unrar = "0.5.8"
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["bzip2", "deflate", "ppmd"] }
tar = "0.4.46"
# Import from URL (D-028): HTTPS through Windows' own TLS (SChannel), only when a link is pasted.
ureq = { version = "2.12", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
url = "2"
# PDF rendering through PDFium (D-013), loaded from pdfium.dll at runtime. `pdfium_latest` is the
# PDFium API version scripts/fetch-deps.ps1 pins (chromium/7881).
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "image_latest", "thread_safe"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security_Cryptography",
    "Win32_UI_Shell",
] }

# Optimize dependencies even in debug builds: SQLite, image decoding and hashing are slow unoptimized.
[profile.dev.package."*"]
opt-level = 2
