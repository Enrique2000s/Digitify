<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Digitify Manual cover</title>
    <!-- The manual's own cover (D-150): a book-shaped (2 : 3) picture made by `npm run manual`, used as
         the manual's cover in Books so nothing of it is cut. {{FONT}}, {{VERSION}} and {{EDITION}} are filled in. -->
    <style>
      @font-face {
        font-family: "Nunito";
        src: url("{{FONT}}") format("woff2");
        font-weight: 200 1000;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        width: 600px;
        height: 900px;
        overflow: hidden;
      }
      body {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 0 54px 70px;
        box-sizing: border-box;
        font-family: "Nunito", sans-serif;
        color: #fff;
        background:
          radial-gradient(circle at 78% 18%, rgba(255, 255, 255, 0.16) 0 90px, transparent 91px),
          radial-gradient(circle at 92% 62%, rgba(255, 255, 255, 0.08) 0 120px, transparent 121px),
          radial-gradient(ellipse 90% 60% at 0% 100%, rgba(224, 71, 138, 0.6), transparent 70%),
          linear-gradient(160deg, #0e1b2c 0%, #12406a 50%, #1592d0 100%);
      }
      .shelf {
        position: absolute;
        top: 120px;
        left: 54px;
        display: flex;
        align-items: flex-end;
        gap: 14px;
      }
      .shelf span {
        display: block;
        width: 56px;
        border-radius: 10px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.12));
        box-shadow: 0 14px 26px rgba(0, 0, 0, 0.25);
      }
      .logo {
        width: 108px;
        height: 108px;
        margin-bottom: 34px;
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.35));
      }
      h1 {
        margin: 0;
        font-size: 84px;
        font-weight: 900;
        line-height: 0.95;
        letter-spacing: -0.01em;
      }
      p {
        margin: 22px 0 34px;
        color: rgba(240, 247, 255, 0.86);
        font-size: 25px;
        font-weight: 700;
        line-height: 1.3;
      }
      .tags {
        display: flex;
        gap: 12px;
      }
      .tags span {
        padding: 6px 16px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.15);
        font-size: 18px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div class="shelf"><span style="height: 150px"></span><span style="height: 210px"></span><span style="height: 120px; width: 96px"></span><span style="height: 180px"></span><span style="height: 240px"></span></div>
    <svg class="logo" viewBox="0 0 34 34" aria-hidden="true">
      <rect x="1" y="1" width="32" height="32" rx="11" fill="#2aa7e6" />
      <path d="M12 1h10a11 11 0 0 1 11 11v3H1v-3A11 11 0 0 1 12 1z" fill="#ffffff" opacity="0.22" />
      <rect x="9" y="10" width="4" height="15" rx="2" fill="#ffffff" />
      <rect x="14.5" y="12.5" width="4" height="12.5" rx="2" fill="#ffffff" />
      <circle cx="24" cy="20.5" r="4.4" fill="none" stroke="#ffffff" stroke-width="2.6" />
    </svg>
    <h1>Digitify<br />Manual</h1>
    <p>Everything you can do, in plain words.</p>
    <div class="tags"><span>Digitify {{VERSION}}</span><span>Edition {{EDITION}}</span></div>
  </body>
</html>
